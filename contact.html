<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Get Quote</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body class="stick-page">

<header>
  <div class="header-form">
    <a href="index.html">
      
    </a>
    <h1 id="contact-header">Send a Message</h1>
  </div>
  
</header>

<div class="form-wrapper"> 

  <a href="index.html" class="back-link"> < Back </a> 

  <section class="contact-form">

    <form
      id="telegramForm"
      
      enctype="multipart/form-data"
    >

      <input
        type="text"
        name="name"
        placeholder="Name"
        required
      >

      <input
        type="tel"
        id="phone"
        name="phone"
        placeholder="(123)456-7890"
        required
      >

      <input
        type="email"
        name="email"
        placeholder="Email Address"
        required
      >

      <label class="service-title">Type of Service</label>

      <div class="service-container">
        
          <div class="service-selects">

              <select id="serviceType" name="serviceType" required>
                  <option value="">Category</option>

                  <option value="General Repairs">General Repairs</option>
                  <option value="Plumbing">Plumbing</option>
                  <option value="Electrical">Electrical</option>
                  <option value="Flooring">Flooring</option>
                  <option value="Doors & Windows">Doors & Windows</option>
                  <option value="Appliance Installation">Outdoor</option>
                  <option value="Outdoor">Appliance Installation</option>
                  <option value="Other">Other</option>
              </select>

              <select id="specificService" name="specificService" required>
                  <option value="">Select Service</option>
              </select>

          </div>

      </div>

      <textarea
        name="message"
        placeholder="Describe Issue"
        rows="5"
      ></textarea>

      <label class="upload-label">
        Attach Photo Of Your Issue (Up to 5)
      </label>

      <input
        type="file"
        name="photos"
        accept="image/*"
        multiple
      >

      <button type="submit">
        Send Application
      </button>

    </form>

    <p id="formStatus" class="status"></p>

  </section>

</div>

<div id="footer-container"></div>

<script src="components/footer.js"></script>
<script src="script.js"></script>

</body>
</html>
